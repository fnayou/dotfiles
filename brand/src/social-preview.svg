<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">{{NAME}} — {{TAGLINE}}</title>
  <desc id="description">Macchiato Blue dotfiles for {{PLATFORMS}} with {{PACKAGE_COUNT}} packages and {{TASK_COUNT}} task commands.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{BASE}}"/><stop offset="1" stop-color="{{CRUST}}"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1110" cy="104" r="236" fill="{{ACCENT}}" opacity=".07"/>
  <circle cx="1170" cy="588" r="200" fill="{{LAVENDER}}" opacity=".05"/>
  <rect x="48" y="48" width="1184" height="544" rx="24" fill="none" stroke="{{SURFACE1}}" stroke-width="2"/>
  <g transform="translate(92 96)">
    <rect width="100" height="100" rx="22" fill="{{MANTLE}}" stroke="{{ACCENT}}" stroke-width="3"/>
    <path d="M24 39 39 50 24 61" fill="none" stroke="{{ACCENT}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 61h17" stroke="{{TEXT}}" stroke-width="5" stroke-linecap="round"/>
    <path d="M69 25v16m0 4v18m0 4v14m0-23c0-7 5-10 12-10h3" fill="none" stroke="{{LAVENDER}}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="69" cy="21" r="5" fill="{{ACCENT}}"/><circle cx="86" cy="44" r="5" fill="{{ACCENT}}"/><circle cx="69" cy="81" r="5" fill="{{LAVENDER}}"/>
  </g>
  <text x="224" y="138" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="23" fill="{{SUBTEXT1}}">PERSONAL · CROSS-PLATFORM · MANUAL FIRST</text>
  <text x="220" y="247" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="69" font-weight="700" letter-spacing="-3">
    <tspan fill="{{LAVENDER}}">fnayou/</tspan><tspan fill="{{ACCENT}}">dotfiles</tspan>
  </text>
  <text x="96" y="315" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="24" fill="{{TEXT}}">{{TAGLINE}}</text>
  <text x="96" y="364" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="18" fill="{{SUBTEXT1}}">{{PLATFORMS}}</text>
  <g transform="translate(96 430)">
    <rect width="326" height="88" rx="14" fill="{{MANTLE}}" stroke="{{SURFACE0}}" stroke-width="2"/>
    <text x="22" y="39" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="{{ACCENT}}">{{PACKAGE_COUNT}}</text>
    <text x="22" y="66" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="{{SUBTEXT1}}">CONFIG PACKAGES</text>
  </g>
  <g transform="translate(449 430)">
    <rect width="326" height="88" rx="14" fill="{{MANTLE}}" stroke="{{SURFACE0}}" stroke-width="2"/>
    <text x="22" y="39" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="{{ACCENT}}">{{TASK_COUNT}}</text>
    <text x="22" y="66" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="{{SUBTEXT1}}">TASK COMMANDS</text>
  </g>
  <g transform="translate(802 430)">
    <rect width="382" height="88" rx="14" fill="{{MANTLE}}" stroke="{{SURFACE0}}" stroke-width="2"/>
    <text x="22" y="39" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="{{ACCENT}}">{{RELEASE}}</text>
    <text x="22" y="66" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="{{SUBTEXT1}}">CURRENT RELEASE</text>
  </g>
  <text x="96" y="558" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="16" fill="{{SUBTEXT0}}">GNU Stow  /  Catppuccin Macchiato  /  Blue accent</text>
</svg>
