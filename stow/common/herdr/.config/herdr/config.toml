onboarding = false

[update]
channel = "stable"

[theme]
# Built-in base: catppuccin — closest to Macchiato; Herdr ships catppuccin,
# catppuccin-latte and catppuccin-mocha, but no macchiato variant. The base
# only shows through for colours Herdr does not expose as overrides below.
name = "catppuccin"

# Catppuccin Macchiato overrides — all eight slots Herdr exposes, so no
# colour is inherited from the base theme by accident.
[theme.custom]
panel_bg    = "#24273a"  # Base
surface_dim = "#1e2030"  # Mantle
accent      = "#8aadf4"  # Blue
mauve       = "#c6a0f6"  # Mauve
green       = "#a6da95"  # Green
yellow      = "#eed49f"  # Yellow
red         = "#ed8796"  # Red
peach       = "#f5a97f"  # Peach

[terminal]
default_shell = "zsh"  # Matches shell preference on both macOS and Arch
new_cwd = "follow"     # New panes inherit the working directory of the active pane

[ui]
show_agent_labels_on_pane_borders = true
sidebar_width = 25            # Starting sidebar width in columns (Herdr clamps to 18–36)
agent_panel_sort = "spaces"   # Group the agent panel by space (Herdr's default ordering)

[ui.toast]
delivery = "herdr"     # Herdr-internal toast UI (not OS notification system)

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true
