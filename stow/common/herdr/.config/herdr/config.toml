onboarding = false

[update]
channel = "stable"

[theme]
# Built-in base: catppuccin — closest to Macchiato; Herdr ships catppuccin,
# catppuccin-latte and catppuccin-mocha, but no macchiato variant.
name = "catppuccin"

# Catppuccin Macchiato blue overrides for Herdr's current custom token surface.
[theme.custom]
panel_bg      = "#24273a"  # Base
sidebar_bg    = "#1e2030"  # Mantle
active_row_bg = "#363a4f"  # Surface0
selection_bg  = "#494d64"  # Surface1
surface0      = "#363a4f"  # Surface0
surface1      = "#494d64"  # Surface1
surface_dim   = "#1e2030"  # Mantle
overlay0      = "#6e738d"  # Overlay0
overlay1      = "#8087a2"  # Overlay1
text          = "#cad3f5"  # Text
subtext0      = "#a5adcb"  # Subtext0
accent        = "#8aadf4"  # Blue
mauve         = "#c6a0f6"  # Mauve
green         = "#a6da95"  # Green
yellow        = "#eed49f"  # Yellow
red           = "#ed8796"  # Red
blue          = "#8aadf4"  # Blue
teal          = "#8bd5ca"  # Teal
peach         = "#f5a97f"  # Peach

[terminal]
default_shell = "zsh"  # Matches shell preference on both macOS and Arch
new_cwd = "follow"     # New panes inherit the working directory of the active pane

[ui]
show_agent_labels_on_pane_borders = true
sidebar_width = 25            # Starting sidebar width in columns (Herdr clamps to 18–36)
agent_panel_sort = "spaces"   # Group the agent panel by space (Herdr's default ordering)

[ui.toast]
delivery = "herdr"     # Herdr-internal toast UI (not OS notification system)

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true
