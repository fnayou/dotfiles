#? Config file for btop v. 1.x
# https://github.com/aristocratos/btop
#
# Managed by dotfiles (stow/common/btop). Catppuccin Macchiato theme.
# The theme file lives in themes/ and is read directly — no cache-build step
# (see docs/guides/btop-setup.md).
#
# Only a small, opinionated subset of options is set here. btop writes every
# other option back with its own defaults on first run. Uncomment and tweak the
# commented lines below to taste; run `btop --help` or press `Esc` in btop to
# open the options menu for the full list.

# Catppuccin Macchiato — theme file name in themes/ (without the .theme suffix).
# Its highlight/selected/proc-box colors are Blue (#8aadf4) by default.
color_theme = "catppuccin_macchiato"

# Use the terminal's background instead of the theme's main_bg (keeps terminal
# transparency). Set to True to paint the theme background instead.
theme_background = False

# Use 24-bit truecolor. Set False only on terminals limited to 256 colors.
truecolor = True

# Enable vim-style hjkl navigation keys in addition to the arrow keys.
vim_keys = True

# --- Common tweakables (uncomment to override btop's defaults) --------------

# Boxes to show at startup, space-separated: "cpu mem net proc".
#shown_boxes = "cpu mem net proc"

# Update interval in milliseconds (min 100). Higher = less CPU used by btop.
#update_ms = 2000

# Default process sort column: pid, program, arguments, threads, user, memory,
# cpu lazy, cpu direct.
#proc_sorting = "cpu lazy"

# Show processes as a tree.
#proc_tree = False

# Graph symbol style: "braille", "block", or "tty".
#graph_symbol = "braille"

# Temperature unit: "celsius", "fahrenheit", "kelvin", or "rankine".
#temp_scale = "celsius"

# Clock shown in the top bar (strftime format). Empty string hides it.
#clock_format = "%X"

# Rounded box corners (False = square corners).
#rounded_corners = True
