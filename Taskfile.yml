version: "3"

tasks:
  default:
    desc: "List all available tasks"
    silent: true
    cmds:
      - task --list

  detect:
    desc: "Print detected OS (macos or arch)"
    silent: true
    cmds:
      - bash scripts/detect-os.sh

  check:
    desc: "Verify prerequisites (stow, git, task) are installed"
    silent: true
    cmds:
      - bash scripts/check.sh

  # OS maintenance tasks (update, clean:apply) are mutating — the ADR-0009 ban is
  # explicitly lifted for them by ADR-0052; both are MANUAL USE ONLY. `clean` stays dry-run.
  update:
    desc: "OS maintenance: sync + upgrade installed packages (Arch: yay/pacman, macOS: brew) — interactive. MANUAL USE ONLY"
    silent: true
    cmds:
      - bash scripts/os-maintenance.sh update

  clean:
    desc: "OS maintenance: report what cleanup would remove (orphans, package cache, journal) — DRY RUN, deletes nothing"
    silent: true
    cmds:
      - bash scripts/os-maintenance.sh clean

  clean:apply:
    desc: "OS maintenance: perform cleanup — DESTRUCTIVE (removes orphans, prunes cache, vacuums journal). Re-prints the report first. MANUAL USE ONLY"
    silent: true
    cmds:
      - bash scripts/os-maintenance.sh clean --apply

  list:
    desc: "List Stow packages — output is <area>/<package>, use as: task dry-run AREA=<area> PACKAGE=<package>"
    silent: true
    cmds:
      - find stow -mindepth 2 -maxdepth 2 -type d -print | sed 's|^stow/||'

  dry-run:
    desc: "Dry-run a Stow package — usage: task dry-run AREA=<common> PACKAGE=<name> (macos/arch are future areas)"
    silent: true
    preconditions:
      - sh: '[ -n "{{.AREA}}" ]'
        msg: "AREA is required: common, macos, or arch"
      - sh: '[ -n "{{.PACKAGE}}" ]'
        msg: "PACKAGE is required, e.g. PACKAGE=git"
    cmds:
      - stow --dir=stow/{{.AREA}} --target="$HOME" --simulate {{.PACKAGE}}

  changelog:
    desc: "Regenerate CHANGELOG.md from Conventional Commits (git-cliff) — writes the file in place"
    silent: true
    preconditions:
      - sh: command -v git-cliff >/dev/null 2>&1
        msg: "git-cliff not installed — run: task changelog:install"
    cmds:
      - git-cliff --config cliff.toml --output CHANGELOG.md
      - echo "CHANGELOG.md regenerated. Review the diff before committing."

  changelog:preview:
    desc: "Preview the unreleased changelog section to stdout — writes nothing"
    silent: true
    preconditions:
      - sh: command -v git-cliff >/dev/null 2>&1
        msg: "git-cliff not installed — run: task changelog:install"
    cmds:
      - git-cliff --config cliff.toml --unreleased

  changelog:install:
    desc: "Print git-cliff install commands per OS — prints only, does not install"
    silent: true
    cmds:
      - |
        echo ""
        echo "git-cliff install commands"
        echo "=========================="
        echo ""
        echo "# macOS"
        echo "  brew install git-cliff"
        echo ""
        echo "# Arch / EndeavourOS (extra repo)"
        echo "  sudo pacman -S git-cliff"
        echo ""
        echo "# Debian (not in the archive — use the prebuilt binary or cargo):"
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  cargo install git-cliff   # if a Rust toolchain is present"
        echo "  # or download a release binary from https://github.com/orhun/git-cliff/releases"
        echo ""

  test:statusline:
    desc: "Run the Claude Code status line caveman-segment unit tests — read-only, uses a temp cache, never touches $HOME"
    silent: true
    preconditions:
      - sh: command -v node >/dev/null 2>&1
        msg: "node not installed — required by the caveman status line segment"
    cmds:
      - node --test stow/common/claude/tests/statusline-caveman.test.js

  check:statusline:
    desc: "End-to-end check of the status line with synthetic transcripts — sandboxed, never touches your real caveman state or cache"
    silent: true
    cmds:
      - bash scripts/check-statusline.sh

  deps:check:zsh:
    desc: "Check zsh shell-tier dependencies (fzf, zoxide, eza, bat, oh-my-posh, zinit) — read-only, never installs"
    silent: true
    cmds:
      - bash scripts/check-zsh-deps.sh

  deps:check:nvim:
    desc: "Check Neovim-tier dependencies (nvim, tree-sitter, rg, fd, node) — read-only, never installs"
    silent: true
    cmds:
      - bash scripts/check-nvim-deps.sh

  deps:brew:
    desc: "Print manual install commands for macOS / Homebrew — prints only, does not install"
    silent: true
    cmds:
      - |
        echo ""
        echo "Shell dependency install commands (macOS / Homebrew)"
        echo "======================================================"
        echo ""
        echo "Step 1 — Install all tools via Brewfile:"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  brew bundle --file=packages/Brewfile"
        echo ""
        echo "Step 2 — Install zinit (one-time manual clone):"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  git clone https://github.com/zdharma-continuum/zinit.git \\"
        echo "    \"\${XDG_DATA_HOME:-\$HOME/.local/share}/zinit/zinit.git\""
        echo ""
        echo "Step 3 — Neovim extras (Brewfile installs neovim/node/python;"
        echo "         treesitter parsers also need a C compiler):"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  xcode-select --install"
        echo "  npm install -g tree-sitter-cli   # CLI for treesitter (brew formula is lib-only)"
        echo ""
        echo "  Then launch Neovim once to install plugins + LSP servers:"
        echo "  nvim --headless \"+Lazy! sync\" +qa"
        echo ""
        echo "Step 4 — Verify:"
        echo ""
        echo "  task deps:check:zsh"
        echo ""

  deps:arch:
    desc: "Print manual install commands for Arch / EndeavourOS — prints only, does not install"
    silent: true
    cmds:
      - |
        echo ""
        echo "Shell dependency install commands (Arch / EndeavourOS)"
        echo "======================================================="
        echo ""
        echo "Step 1 — Install pacman packages:"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  sudo pacman -S git stow go-task git-cliff fzf zoxide eza bat \\"
        echo "    neovim ripgrep fd nodejs npm python python-pipx base-devel"
        echo ""
        echo "Step 2 — Install AUR packages (requires yay or paru):"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  yay -S oh-my-posh-bin"
        echo ""
        echo "Step 3 — Install zinit (one-time manual clone):"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  git clone https://github.com/zdharma-continuum/zinit.git \\"
        echo "    \"\${XDG_DATA_HOME:-\$HOME/.local/share}/zinit/zinit.git\""
        echo ""
        echo "Step 4 — Neovim extras (treesitter parsers need a C compiler):"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  sudo pacman -S base-devel tree-sitter-cli"
        echo ""
        echo "  Then launch Neovim once to install plugins + LSP servers:"
        echo "  nvim --headless \"+Lazy! sync\" +qa"
        echo ""
        echo "Step 5 — Verify:"
        echo ""
        echo "  task deps:check:zsh"
        echo ""

  deps:debian:
    desc: "Print manual install commands for Debian (stable / trixie) — prints only, does not install"
    silent: true
    cmds:
      - |
        echo ""
        echo "Shell dependency install commands (Debian stable / trixie)"
        echo "=========================================================="
        echo ""
        echo "Step 1 — Install apt packages:"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  sudo apt install git stow fzf zoxide eza bat \\"
        echo "    neovim ripgrep fd-find nodejs npm python3 python3-pip pipx build-essential"
        echo ""
        echo "  Note — Debian binary names differ: bat -> batcat, fd -> fdfind"
        echo ""
        echo "  Note — Neovim version: nvim-treesitter (main) needs Neovim >= 0.11."
        echo "  If apt's neovim is older (check: nvim --version), use the prebuilt tarball:"
        echo "    curl -fsSL https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz \\"
        echo "      | tar xz -C ~/.local --strip-components=1"
        echo ""
        echo "Step 2 — Out-of-band tools (not in the Debian archive):"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  sh -c \"\$(curl -fsSL https://taskfile.dev/install.sh)\" -- -d -b ~/.local/bin   # go-task"
        echo "  curl -s https://ohmyposh.dev/install.sh | bash -s                              # oh-my-posh"
        echo "  cargo install git-cliff                                                        # git-cliff (Rust toolchain)"
        echo "  # git-cliff alternative: release binary from https://github.com/orhun/git-cliff/releases"
        echo ""
        echo "Step 3 — Install zinit (one-time manual clone):"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  git clone https://github.com/zdharma-continuum/zinit.git \\"
        echo "    \"\${XDG_DATA_HOME:-\$HOME/.local/share}/zinit/zinit.git\""
        echo ""
        echo "Step 4 — tree-sitter CLI (node-free prebuilt binary, not npm):"
        echo ""
        echo "  ⚠️  MANUAL STEP — review before running"
        echo "  curl -fsSL https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-linux-x64.gz \\"
        echo "    | gunzip > ~/.local/bin/tree-sitter && chmod +x ~/.local/bin/tree-sitter"
        echo ""
        echo "  Then launch Neovim once to install plugins + LSP servers:"
        echo "  nvim --headless \"+Lazy! sync\" +qa"
        echo ""
        echo "Step 5 — Verify:"
        echo ""
        echo "  task deps:check:zsh"
        echo ""

  git:bootstrap:dry-run:
    desc: "Show include.path entries that would be added to ~/.gitconfig — no changes made. MANUAL USE ONLY: never run automatically"
    silent: true
    cmds:
      - |
        echo ""
        echo "git:bootstrap dry-run — no changes will be made"
        echo "================================================="
        echo ""
        if [[ -f "$HOME/.gitconfig" ]]; then
          echo "~/.gitconfig exists: yes"
        else
          echo "~/.gitconfig exists: no (will be created by git on first --add)"
        fi
        echo ""
        echo "Current include.path values:"
        git config --global --get-all include.path 2>/dev/null || echo "  (none)"
        echo ""
        echo "Required entries:"
        for inc in "~/.config/git/config-common" "~/.config/git/aliases"; do
          if git config --global --get-all include.path 2>/dev/null | grep -qxF "$inc"; then
            echo "  already present: include.path = $inc"
          else
            echo "  would add:       include.path = $inc"
          fi
        done
        echo ""
        if [[ -f "$HOME/.gitconfig" ]]; then
          echo "Backup: yes — a timestamped backup would be created before any change"
        else
          echo "Backup: not needed — ~/.gitconfig does not exist yet"
        fi
        echo ""

  git:bootstrap:
    desc: "Wire ~/.gitconfig to managed Git config — idempotent, creates timestamped backup. MANUAL USE ONLY: never run automatically"
    silent: true
    cmds:
      - |
        GITCONFIG="$HOME/.gitconfig"
        if [[ -f "$GITCONFIG" ]]; then
          BACKUP="${GITCONFIG}.bak.$(date +%Y%m%d%H%M%S)"
          cp "$GITCONFIG" "$BACKUP"
          echo "Backup created: $BACKUP"
        else
          echo "~/.gitconfig does not exist — git will create it on first --add"
        fi
        echo ""
        for inc in "~/.config/git/config-common" "~/.config/git/aliases"; do
          if git config --global --get-all include.path 2>/dev/null | grep -qxF "$inc"; then
            echo "skip (already present): $inc"
          else
            git config --global --add include.path "$inc"
            echo "added: $inc"
          fi
        done
        echo ""
        echo "Final include.path values:"
        git config --global --get-all include.path 2>/dev/null || echo "  (none)"
        echo ""

  zsh:bootstrap:dry-run:
    desc: "Show what zsh:bootstrap would do to ~/.zshrc — no changes made. MANUAL USE ONLY: never run automatically"
    silent: true
    cmds:
      - |
        echo ""
        echo "zsh:bootstrap dry-run — no changes will be made"
        echo "================================================="
        echo ""
        ZSHRC="$HOME/.zshrc"
        BLOCK_MARKER="# >>> dotfiles managed zsh layer >>>"
        if [[ -L "$ZSHRC" ]]; then
          echo "~/.zshrc is a symlink — would REFUSE (symlink)"
          echo ""
          exit 0
        fi
        if [[ -f "$ZSHRC" ]]; then
          echo "~/.zshrc exists: yes"
          echo ""
          if grep -qF "$BLOCK_MARKER" "$ZSHRC"; then
            echo "managed block already present — no changes needed"
            echo "Backup: not needed"
          else
            echo "managed block would be appended"
            echo "Backup: yes — a timestamped backup would be created before any change"
          fi
        else
          echo "~/.zshrc exists: no"
          echo "file does not exist — would be created"
          echo "Backup: not needed"
        fi
        echo ""
        echo "Block that would be appended:"
        echo "------------------------------"
        echo ""
        echo "# >>> dotfiles managed zsh layer >>>"
        echo "if [[ -r \"\$HOME/.config/zsh/index.zsh\" ]]; then"
        echo "  source \"\$HOME/.config/zsh/index.zsh\""
        echo "fi"
        echo "# <<< dotfiles managed zsh layer <<<"
        echo ""

  zsh:bootstrap:
    desc: "Wire ~/.zshrc to managed zsh layer — idempotent, creates timestamped backup. MANUAL USE ONLY: never run automatically"
    silent: true
    cmds:
      - |
        ZSHRC="$HOME/.zshrc"
        BLOCK_MARKER="# >>> dotfiles managed zsh layer >>>"
        if [[ -L "$ZSHRC" ]]; then
          echo "REFUSED: ~/.zshrc is a symlink — will not write into a managed symlink target"
          exit 1
        fi
        if [[ -f "$ZSHRC" ]]; then
          if grep -qF "$BLOCK_MARKER" "$ZSHRC"; then
            echo "Managed block already present — nothing to do"
            exit 0
          fi
          BACKUP="${ZSHRC}.bak.$(date +%Y%m%d%H%M%S)"
          cp "$ZSHRC" "$BACKUP"
          echo "Backup created: $BACKUP"
        else
          echo "~/.zshrc does not exist — creating"
        fi
        printf '\n# >>> dotfiles managed zsh layer >>>\nif [[ -r "$HOME/.config/zsh/index.zsh" ]]; then\n  source "$HOME/.config/zsh/index.zsh"\nfi\n# <<< dotfiles managed zsh layer <<<\n' >> "$ZSHRC"
        echo "Managed block appended to ~/.zshrc"
        echo ""
        echo "Verify with:"
        echo "  exec zsh         # reload current shell"
        echo "  zsh -n ~/.zshrc  # syntax check"
        echo ""
